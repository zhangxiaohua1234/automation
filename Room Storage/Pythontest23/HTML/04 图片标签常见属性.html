<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>04 图片标签常见属性</title>
</head>

<body>
    <!--1 正常的图片 -->
    <img src="04.jpg">
    <br>
    <!--2 设置宽度的图片 -->
    <img src="04.jpg" width="200" height="100">
    <br>
    <!-- 3 带标题的图片 -->
    <img src="04.jpg" width="200" title="这是挂钩">
    <br>
    <img src="05.jpg" alt="这是一张图片">


</body>
</html>
