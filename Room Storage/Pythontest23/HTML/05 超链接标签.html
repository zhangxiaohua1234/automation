<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>超链接标签</title>
</head>

<body>
    <!--1 可跳转链接 -->
    <a href="http://www.baidu.com">百度一下，您就知道</a>
    <br>
    <!--2 空连接 -->
    <a href="#">百度一下，您就知道</a>

</body>
</html>
