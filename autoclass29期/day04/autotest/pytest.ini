[pytest]

markers =
    smoke
    todo
    p2
    p3


addopts = -vs


cache_dir = cache

testpaths = testcase
python_files = test_*.py
python_classes = Test*
python_functions = test_*

timeout = 30

send_email = True
gen_report = True

log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)s | %(filename)s[%(lineno)dL]::%(funcName)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/test.log
log_file_level = INFO
log_file_format = %(asctime)s | %(levelname)s | %(filename)s[%(lineno)dL]::%(funcName)s
log_file_date_format = %Y-%m-%d %H:%M:%S


